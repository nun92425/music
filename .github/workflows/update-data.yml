name: favibe update data

on:
  schedule:
    - cron: '0 21 * * *' # JST 6:00 (UTC 21:00)
  workflow_dispatch:
    inputs:
      all:
        description: '全アーティストを更新 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            node scripts/fetch-youtube.js --all
          else
            node scripts/fetch-youtube.js
          fi
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "favibe-bot"
          git config user.email "favibe-bot@users.noreply.github.com"
          git add data.json data/selected.json || true
          git commit -m "chore: update data $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
